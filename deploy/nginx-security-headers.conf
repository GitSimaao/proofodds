# Security headers for ProofOdds, kept in their own file for one nginx reason:
# `add_header` is NOT inherited by a location block that declares any header of
# its own. Repeating them via `include` in every location is the only way to be
# sure they are actually sent on every response.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Google Fonts supplies type; football-data.org supplies display-only crests.
# form-action does NOT fall back to default-src, so without naming it here the
# page could post a form anywhere. Naming it both allows the newsletter signup
# to reach Kit and forbids everything else.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://crests.football-data.org; form-action 'self' https://app.kit.com; base-uri 'none'; frame-ancestors 'none'" always;
