# ProofOdds — nginx server block.
#
# Designed to coexist with other sites on the same server. It claims
# proofodds.com and www.proofodds.com and touches nothing else: no default
# server, no global settings, no other vhost.
#
#   sudo cp deploy/nginx-proofodds.conf /etc/nginx/sites-available/proofodds
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/proofodds /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d proofodds.com -d www.proofodds.com
#
# certbot rewrites these blocks in place to add TLS and the HTTP->HTTPS
# redirect. Do not hand-edit afterwards without re-running `nginx -t`.
#
# It does not turn on HTTP/2, and the front page asks for a few hundred crests,
# so that costs real time on a first visit. Add it to the FIRST server block
# that claims each 443 socket — nginx reads protocol options from that one and
# warns "protocol options redefined" if a later block repeats them:
#
#   listen [::]:443 ssl http2; # managed by Certbot
#   listen 443 ssl http2;      # managed by Certbot
#
# nginx 1.25.1 and later prefer a standalone `http2 on;` instead. Confirm with
#   curl -sS -o /dev/null -w "%{http_version}\n" https://proofodds.com/

# www -> apex. One canonical host, so the SEO effort is not split in two.
server {
    listen 80;
    listen [::]:80;
    server_name www.proofodds.com;
    return 301 http://proofodds.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name proofodds.com;

    root /opt/proofodds/site;
    index index.html;

    access_log /var/log/nginx/proofodds.access.log;
    error_log  /var/log/nginx/proofodds.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/json application/xml image/svg+xml;

    charset utf-8;

    # The ledger is the product's evidence. Serve it raw, let anyone fetch it
    # from anywhere, and keep the cache short enough that it never looks stale.
    location /predictions/ {
        include snippets/nginx-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        try_files $uri $uri/ =404;
    }

    # Detached OpenTimestamps proofs are binary files, not JSON. Keep their
    # content type honest and make them downloadable by independent verifiers.
    # try_files falls through to the directory's index.html, which is what
    # makes /predictions/ and /timestamps/ browsable rather than 403. Both
    # `default_type` directives only apply to extensions nginx has no mapping
    # for, so the index pages still come back as text/html.
    location /timestamps/ {
        include snippets/nginx-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/octet-stream;
        try_files $uri $uri/ =404;
    }

    # Crests, flags and the social card. These change when a file is replaced,
    # never on a clock, and the front page asks for a few hundred of them — at
    # the five-minute default every reader re-fetched the lot, which on a
    # launch spike is most of the bandwidth and all of the latency.
    location ~* \\.(png|webp|jpe?g|ico)$ {
        include snippets/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(css|svg|xml|txt)$ {
        include snippets/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Pages live at /scorecard/, /ledger/, /method/ as index.html files.
    location / {
        include snippets/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    location = /favicon.svg {
        include snippets/nginx-security-headers.conf;
        access_log off;
    }
}
