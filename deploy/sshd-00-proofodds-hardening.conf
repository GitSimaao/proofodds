# ProofOdds server hardening, 9 October 2026. Source: deploy/sshd-00-proofodds-hardening.conf
# Named 00- so it is read before any other drop-in: sshd keeps the FIRST value
# it sees for each setting.
#
# Root logs in by key only. The root password exists for the Hetzner Cloud
# Console and does not work over SSH.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
